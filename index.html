<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
// LBL home screen launcher. Reads ?t=TEAM&k=KEY from its own address and gives the page
// that team's name and logo, so "Add to Home Screen" saves a team-logo icon.
// Opened from the home screen (or on a computer) it goes straight to the team link.
(function () {
  var TEAMS = {
    ARI:['Diamondbacks',109,'#A71930'], ATL:['Braves',144,'#13274F'], BAL:['Orioles',110,'#DF4601'],
    BOS:['Red Sox',111,'#BD3039'], CAA:['Angels',108,'#BA0021'], CHC:['Cubs',112,'#0E3386'],
    CHW:['White Sox',145,'#27251F'], CIN:['Reds',113,'#C6011F'], CLE:['Guardians',114,'#00385D'],
    COL:['Rockies',115,'#33006F'], DET:['Tigers',116,'#0C2340'], HOU:['Astros',117,'#002D62'],
    KC:['Royals',118,'#004687'], LAD:['Dodgers',119,'#005A9C'], MIA:['Marlins',146,'#00A3E0'],
    MIL:['Brewers',158,'#12284B'], MIN:['Twins',142,'#002B5C'], NYM:['Mets',121,'#002D72'],
    NYY:['Yankees',147,'#0C2340'], LVA:['Athletics',133,'#003831'], PHI:['Phillies',143,'#E81828'],
    PIT:['Pirates',134,'#27251F'], SD:['Padres',135,'#2F241D'], SF:['Giants',137,'#FD5A1E'],
    SEA:['Mariners',136,'#0C2C56'], STL:['Cardinals',138,'#C41E3A'], TB:['Rays',139,'#092C5C'],
    TEX:['Rangers',140,'#003278'], TOR:['Blue Jays',141,'#134A8E'], WAS:['Nationals',120,'#AB0003']
  };
  var EXEC = 'https://script.google.com/macros/s/AKfycbxBsBAHmzOny7Hr3BCYxsBylr3jArnpO0o4JIbugKJUMpotDu-2PzWUYZMUsG5vAeT4/exec';
  var q = new URLSearchParams(location.search);
  var t = String(q.get('t') || '').toUpperCase();
  var k = String(q.get('k') || '');
  var team = TEAMS[t];
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var phone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var L = window.LBL = {
    ok: !!(team && k), t: t, name: team ? team[0] : 'LBL', color: team ? team[2] : '#1f2937',
    icon: team ? 'https://midfield.mlbstatic.com/v1/team/' + team[1] + '/spots/256' : '',
    href: EXEC + '?t=' + encodeURIComponent(t) + '&k=' + encodeURIComponent(k),
    ios: /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
  };
  if (L.ok && (standalone || !phone)) { location.replace(L.href); return; }
  var h = '<title>' + L.name + '</title>' +
    '<meta name="apple-mobile-web-app-title" content="' + L.name + '">' +
    '<meta name="theme-color" content="' + L.color + '">';
  if (L.icon) {
    h += '<link rel="apple-touch-icon" href="' + L.icon + '">' +
         '<link rel="icon" type="image/png" sizes="256x256" href="' + L.icon + '">';
  }
  document.write(h);
})();
</script>
<style>
  html, body { margin: 0; min-height: 100%; }
  body { font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #fff;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh;
         padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); box-sizing: border-box; text-align: center; }
  .card { max-width: 360px; width: 100%; }
  .logo { width: 128px; height: 128px; border-radius: 28px; background: rgba(255,255,255,.12); display: block; margin: 0 auto 16px; object-fit: contain; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { opacity: .8; margin: 0 0 24px; }
  .btn { display: block; background: #fff; color: #111; text-decoration: none; font-weight: 600; font-size: 18px;
         padding: 14px 18px; border-radius: 14px; margin-bottom: 20px; }
  .tip { background: rgba(0,0,0,.25); border-radius: 14px; padding: 14px 16px; text-align: left; font-size: 15px; }
  .tip b { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card" id="c"></div>
<script>
  var L = window.LBL;
  document.body.style.background = L.color;
  var c = document.getElementById('c');
  if (!L.ok) {
    c.innerHTML = '<h1>LBL</h1><p class="sub">This link isn\'t valid. Ask a commissioner in Slack for your team\'s link.</p>';
  } else {
    var steps = L.ios
      ? 'Open this page in Safari, tap the Share button, then <i>Add to Home Screen</i>. If you opened it from Slack, tap the compass or "Open in Safari" first.'
      : 'Open this page in Chrome, tap the three dots, then <i>Add to Home screen</i>.';
    c.innerHTML =
      '<img class="logo" alt="" src="' + L.icon + '">' +
      '<h1>' + L.name + '</h1><p class="sub">Little Big League</p>' +
      '<a class="btn" href="' + L.href + '">Open my team</a>' +
      '<div class="tip"><b>Save it to your home screen</b>' + steps +
      ' After that, the icon opens your team page directly.</div>';
  }
</script>
</body>
</html>
